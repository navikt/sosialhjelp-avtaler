version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: daily
    groups:
      patch-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
    commit-message:
      prefix: "[npm]"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
    commit-message:
      prefix: "[gha]"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: daily
    commit-message:
      prefix: "[docker]"
